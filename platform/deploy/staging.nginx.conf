# سند (Sanad) — staging reverse proxy on a subdomain of the SAME domain.
# staging.os.evcsol.com  →  the new app on 127.0.0.1:4100.
# The old platform on os.evcsol.com is NOT touched by this file — it stays live as backup.
#
# Install:
#   sudo cp deploy/staging.nginx.conf /etc/nginx/sites-available/sanad-staging.conf
#   sudo ln -s /etc/nginx/sites-available/sanad-staging.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then add TLS (free): sudo certbot --nginx -d staging.os.evcsol.com

server {
    listen 80;
    listen [::]:80;
    server_name staging.os.evcsol.com;

    # certbot will manage the 443 block + redirect after you run it.

    client_max_body_size 12m;   # contract-file uploads for AI intake

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI extraction can take a few seconds
    }
}
