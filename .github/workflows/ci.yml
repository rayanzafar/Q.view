name: CI — سند

on:
  push:
    branches: ['**']
    paths: ['platform/**', '.github/workflows/**', 'AGENTS.md', 'CLAUDE.md']
  pull_request:
    paths: ['platform/**', '.github/workflows/**', 'AGENTS.md', 'CLAUDE.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Syntax check (src + scripts)
        run: |
          set -e
          for f in $(find src scripts -name '*.js' -o -name '*.mjs'); do node --check "$f"; done
      - name: Glossary check (no technical jargon in UI copy)
        run: node scripts/check-glossary.mjs
      - name: Documentation matches the implementation
        run: node scripts/check-docs.mjs
      - name: System graph matches source
        run: npm run graph:check
      - name: Migrate + seed RBAC + seeded demo (schema + fixture sanity)
        run: |
          node --experimental-sqlite scripts/migrate.js
          node --experimental-sqlite scripts/seed-rbac.js
          node --experimental-sqlite scripts/seed.js
          node --experimental-sqlite scripts/lib/seed-fixture.mjs
      - name: Full test suite (unit / integration / security / permissions matrix)
        run: node --experimental-sqlite --test "tests/**/*.test.js"

  postgres-revenue:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sanad_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: sanad_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sanad_test -d sanad_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Revenue integrity on disposable PostgreSQL
        run: node --test tests/integration/revenue-integrity.test.js
        env:
          DATABASE_URL: postgresql://sanad_test:local_test_only@127.0.0.1:5432/sanad_test
          SANAD_TEST_POSTGRES: '1'

  e2e:
    runs-on: ubuntu-latest
    needs: [test, postgres-revenue]
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (rtl / a11y / kanban / states)
        continue-on-error: false
        run: node --experimental-sqlite scripts/e2e.mjs
